<!doctype html>
<html lang="en" data-theme="">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Create your Goodform account." />
    <title>Create account | Goodform</title>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="flex min-h-screen flex-col bg-base-200 text-base-content">
    <header>
      <nav aria-label="Main navigation" class="navbar bg-base-100 px-4 shadow-sm sm:px-8">
        <div class="navbar-start">
          <a href="./index.html" class="btn btn-ghost text-xl font-bold tracking-tight">goodform</a>
        </div>
        <div class="navbar-end">
          <a href="./products.html" class="btn btn-ghost">Shop products</a>
        </div>
      </nav>
    </header>

    <nav aria-label="Breadcrumbs" class="mx-auto w-full max-w-6xl px-4 py-3 sm:px-8">
      <div class="breadcrumbs text-sm">
        <ul>
          <li><a href="./index.html">Home</a></li>
          <li aria-current="page"><span>Create account</span></li>
        </ul>
      </div>
    </nav>

    <main class="grid flex-1 place-items-center px-4 py-10">
      <section aria-labelledby="signup-title" class="card w-full max-w-md bg-base-100 shadow-xl">
        <div class="card-body gap-5 p-6 sm:p-8">
          <div>
            <p class="text-sm font-semibold uppercase tracking-[0.16em] text-primary">Join Goodform</p>
            <h1 id="signup-title" class="mt-2 text-3xl font-bold tracking-tight">Create account</h1>
            <p class="mt-2 text-base-content/70">A Goodform account makes it easy to keep up with your orders.</p>
          </div>

          <form id="signup-form" class="flex flex-col gap-5">
            <label class="form-control flex w-full flex-col gap-2">
              <span class="label-text font-medium">Name</span>
              <input
                type="text"
                name="name"
                autocomplete="name"
                placeholder="Your name"
                class="input input-bordered w-full"
                required
              />
            </label>

            <label class="form-control flex w-full flex-col gap-2">
              <span class="label-text font-medium">Email address</span>
              <input
                type="email"
                name="email"
                autocomplete="email"
                placeholder="you@example.com"
                class="input input-bordered w-full"
                required
              />
            </label>

            <label class="form-control flex w-full flex-col gap-2">
              <span class="label-text font-medium">Password</span>
              <input
                type="password"
                name="password"
                autocomplete="new-password"
                minlength="8"
                placeholder="At least 8 characters"
                class="input input-bordered w-full"
                required
              />
            </label>

            <label class="form-control flex w-full flex-col gap-2">
              <span class="label-text font-medium">Confirm password</span>
              <input
                type="password"
                name="confirm-password"
                autocomplete="new-password"
                minlength="8"
                placeholder="Enter your password again"
                class="input input-bordered w-full"
                required
              />
            </label>

            <button type="submit" class="btn btn-primary w-full">Create account</button>
            <p id="signup-message" class="text-sm text-base-content/70" aria-live="polite">
              Account creation is a demo only and is not connected to an authentication service.
            </p>
          </form>

          <div class="divider my-0"></div>
          <p class="text-center text-sm text-base-content/70">
            Already have an account?
            <a href="./login.html" class="link link-primary">Sign in</a>
          </p>
        </div>
      </section>
    </main>

    <script>
      const signupForm = document.querySelector("#signup-form");
      const signupMessage = document.querySelector("#signup-message");

      signupForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const password = signupForm.elements.password.value;
        const confirmation = signupForm.elements["confirm-password"].value;

        if (password !== confirmation) {
          signupMessage.textContent = "Passwords do not match. Please check and try again.";
          signupMessage.classList.add("text-error");
          return;
        }

        signupMessage.classList.remove("text-error");
        signupMessage.textContent =
          "Account creation is not configured yet. Connect an authentication service to continue.";
      });
    </script>
  </body>
</html>
